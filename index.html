<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; connect-src 'self'"
  /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
  /><meta name="theme-color" content="#10161b" /><link
    rel="manifest"
    href="manifest.webmanifest"
  /><link
    rel="preload"
    href="assets/fonts/manrope-latin.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  /><link rel="icon" href="assets/icon.svg" type="image/svg+xml" /><link
    rel="stylesheet"
    href="src/design/tokens.css"
  /><link rel="stylesheet" href="src/design/base.css" /><link
    rel="stylesheet"
    href="src/design/shell.css"
  /><link rel="stylesheet" href="src/design/components.css" /><link
    rel="stylesheet"
    href="src/design/pages.css"
  /><link rel="stylesheet" href="src/design/editors.css" /><title>
    AutoLog
  </title>
  <body>
    <a class="skip" href="#app">AutoLog ↓</a>
    <header class="app-bar">
      <h1 class="brand" aria-label="AutoLog">
        <img src="assets/icon.svg" alt="" width="38" height="38" /><span
          class="brand-type"
          >Auto<span>Log</span></span
        >
      </h1>
      <small class="app-context"></small>
      <div id="top-tools"></div>
    </header>
    <nav class="floating-nav" aria-label="AutoLog">
      <button data-view="garage" class="desktop-only">Garage</button
      ><button data-view="dashboard">Dashboard</button
      ><button data-view="services" id="services-nav">Services</button
      ><button id="quick-add" class="mobile-add" aria-label="Add vehicle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg></button
      ><button data-view="fuel" id="fuel-nav">Fuel</button
      ><button data-view="more">More</button>
    </nav>
    <main>
      <div id="app" tabindex="-1"></div>
    </main>
    <footer class="app-release">
      AutoLog <span>2.5.0</span> · Saved on this device
    </footer>
    <dialog id="editor">
      <form id="vehicle">
        <h2 id="form-title"></h2>
        <input name="id" type="hidden" /><label
          >Make<input name="make" list="makes" required maxlength="80" /></label
        ><datalist id="makes">
          <option>Fiat</option>
          <option>Ford</option>
          <option>Volkswagen</option>
          <option>Audi</option>
          <option>Mercedes-Benz</option>
          <option>BMW</option>
          <option>Peugeot</option></datalist
        ><label
          >Model<input
            name="model"
            list="models"
            required
            maxlength="80"
            placeholder="Sedici"
        /></label>
        <p id="custom"></p>
        <datalist id="models"></datalist
        ><label
          >Year<input
            name="year"
            type="number"
            min="1886"
            max="2100"
            required /></label
        ><label
          >Engine, fuel, drivetrain<input
            name="variant"
            maxlength="150"
            placeholder="2.0 MultiJet · Diesel · 4x4" /></label
        ><label
          >Odometer (km)<input
            name="odometer"
            type="number"
            min="0"
            step="1"
            required /></label
        ><label
          >Photo<input
            name="photo"
            type="file"
            accept="image/jpeg,image/png,image/webp" /></label
        ><label
          >Body style<select name="bodyStyle">
            <option value="crossover" data-en="Crossover / SUV">
              Crossover / SUV
            </option>
            <option value="hatchback" data-en="Hatchback">Hatchback</option>
            <option value="sedan" data-en="Sedan">Sedan</option>
            <option value="coupe" data-en="Coupe">Coupe</option>
            <option value="van" data-en="Van">Van</option>
            <option value="motorcycle" data-en="Motorcycle">Motorcycle</option>
          </select></label
        ><label>Nickname<input name="nickname" maxlength="80" /></label
        ><label>License plate<input name="plate" maxlength="30" /></label
        ><label>Notes<textarea name="notes" maxlength="2000"></textarea></label
        ><label
          >Distance unit<select name="unit">
            <option value="km" data-en="Kilometers">Kilometers</option>
            <option value="mi" data-en="Miles">Miles</option>
          </select></label
        ><label
          >Fuel type<select name="fuel">
            <option value="petrol" data-en="Petrol">Petrol</option>
            <option value="diesel" data-en="Diesel">Diesel</option>
            <option value="electric" data-en="Electric">Electric</option>
            <option value="hybrid" data-en="Hybrid">Hybrid</option>
            <option value="other" data-en="Other">Other</option>
          </select></label
        ><label
          >Purchase date<input
            name="purchaseDate"
            type="date"
            maxlength="50" /></label
        ><label
          >Purchase price<input
            name="purchasePrice"
            type="number"
            maxlength="50"
            min="0"
            step="0.01" /></label
        ><label
          >Currency<input name="currency" type="text" maxlength="50" /></label
        ><label>Color<input name="color" type="text" maxlength="50" /></label
        ><label class="checkbox"
          ><input type="checkbox" name="removePhoto" /><span
            id="remove-photo-text"
          ></span
        ></label>
        <footer>
          <button type="button" id="cancel">Cancel</button
          ><button type="submit">Save</button>
        </footer>
        <p id="error" role="alert"></p>
      </form>
    </dialog>
    <script type="module" src="src/boot.js"></script>
  </body>
</html>
